[llm]
# 从 https://platform.deepseek.com 获取，不要提交真实 Key
api_key = sk-your-key-here
base_url = https://api.deepseek.com/v1
model = deepseek-chat
timeout_seconds = 120

[agent]
# 留空则使用启动时的当前目录；相对路径以本项目目录为基准
workspace =
max_tool_rounds = 20
max_text_bytes = 5242880
default_max_chars = 50000
max_list_items = 2000
