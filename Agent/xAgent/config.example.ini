# xAgent 配置文件示例
# 首次启动时如果当前目录没有 config.ini，xAgent 会自动生成一份同样的完整模板。
# 所有选项都有内置默认值，删除或留空某一项不会导致启动失败；
# 修改 [llm] api_key 后重新启动即可正常工作。

[llm]
# 模型服务的 API Key（必填）。不要提交真实 Key。
api_key = sk-your-key-here
base_url = https://api.deepseek.com/v1
model = deepseek-chat
# 单次模型请求超时（秒）
timeout_seconds = 120

[agent]
# 留空则使用启动时的当前目录；相对路径以本配置文件所在目录为基准
workspace =
# 单轮对话的工具调用轮数上限；留空或 0 表示不限制
max_tool_rounds =
max_text_bytes = 5242880
default_max_chars = 50000
max_list_items = 2000

[context]
# 上游没有返回上下文窗口时使用的默认窗口（128k）
default_window = 131072
# 达到该比例后提示并暂停普通提示词（0.8 = 80%）
warning_ratio = 0.8
# 压缩摘要的目标 token 数
summary_tokens = 5000
# 原始上下文归档目录（相对项目根目录）
archive_dir = .agents/context
max_recall_hits = 6
max_recall_chars = 4000
max_message_transcript_chars = 12000
max_tool_transcript_chars = 6000
model_transcript_chars = 240000
display_transcript_chars = 40000

[sessions]
# 会话事件日志目录（相对项目根目录）
directory = .agents/sessions
# 退出时自动保存当前会话
save_on_exit = true
# /new 时自动保存当前会话
auto_save_on_new = true
# 历史会话列表最多显示的条数
max_list = 50
# 启动时读取的项目指令文件（相对项目根目录）
agents_file = AGENTS.md
# 每个会话首次加载时注入一次 AGENTS.md，之后全程复用
inject_agents_md = true
max_agents_md_chars = 20000

[tui]
max_tool_output_chars = 8000
max_tool_arguments_chars = 3000
# 侧栏 MCP 区域最多显示的工具数
mcp_max_tools = 12

[tools]
# 本地命令行（Runcil）
runcli_timeout_seconds = 30
runcli_max_output_chars = 10000
# 网页抓取（fetchWeb）
web_timeout_seconds = 20
web_max_download_bytes = 10485760
# 网络搜索响应体上限
search_max_response_bytes = 5242880
# 启动时查询模型元数据的超时
model_info_timeout_seconds = 10

[search]
# 百度千帆 AI 搜索 API Key（百度智能云控制台创建），不要提交真实 Key
# 留空时 Agent 仍可启动，只有调用 searchweb 时才会返回缺少配置的提示
baidu_qianfan_api_key =
# 可选：自定义搜索接口地址，默认即为官方地址
api_url = https://qianfan.baidubce.com/v2/ai_search/web_search
# 网页结果条数，范围 1-50
top_k = 10
timeout_seconds = 20

[mcp]
# 是否连接 MCP Server（也可用 XAGENT_MCP_ENABLED 覆盖）
enabled = true
# 留空则读取项目根目录的 .mcp.json
config_path =
connect_timeout = 20
call_timeout = 60
max_result_chars = 30000
shutdown_timeout = 8

[logs]
# 是否把调用日志落盘到 <项目根目录>/<directory>/
enabled = true
# 文件日志级别：DEBUG / INFO / WARNING / ERROR（只影响文件，不影响界面）
level = INFO
# 日志目录（相对项目根目录）
directory = .agents/logs
# 单个日志文件大小上限（字节）与保留份数
max_bytes = 2000000
backup_count = 3
