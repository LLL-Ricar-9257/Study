[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xagent-file-agent"
version = "0.1.0"
description = "Core/TUI separated local file management agent built with Textual"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40.0",
    "textual>=0.86.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
xagent = "tui.cli:main"

[tool.setuptools]
packages = ["core", "core.llm", "core.tools", "tui"]

[tool.setuptools.package-data]
tui = ["styles.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
