name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 任务 1：Python MCP 适配层（无需启动 Go 后端，测试全部走 MockTransport）
  pet-hospital-mcp:
    name: pet_hospital_mcp (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Pet-hospital-MCP/pet_hospital_mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Pet-hospital-MCP/pet_hospital_mcp/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests
        run: python -m pytest -q

  # 任务 1：Go 后端（第三方代码，只验证能编译 + 自带测试通过）
  go-backend:
    name: pet-hospital-mcp (go test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Pet-hospital-MCP/pet-hospital-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: Pet-hospital-MCP/pet-hospital-mcp/go.mod
      - run: go vet ./...
      - run: go test ./...

  # 任务 2：AnythingLLM MCP（单元测试全部走 MockTransport）
  anythingllm-mcp:
    name: AnythingLLMMCP (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AnythingLLMMCP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AnythingLLMMCP/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest -q

  # 任务 4：xAgent（源码静态检查）
  xagent:
    name: xAgent (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Agent/xAgent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Agent/xAgent/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check core tui scripts
